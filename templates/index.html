<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Digital Tourism - المرشد السياحي الذكي</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>🌍 AI Digital Tourism</h1>
        <p>منصة السياحة الرقمية الذكية للاستكشاف والتوجيه</p>
    </header>

    <div class="main-container">
        <div class="search-box">
            <input type="text" id="aiQuery" placeholder="أدخل اسم المدينة أو الوجهة السياحية...">
            <button onclick="askAI()">استكشف</button>
        </div>

        <div id="aiResponse" class="response-area">
            أهلاً بك! اكتب وجهتك السياحية للبدء في الاستكشاف.
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
